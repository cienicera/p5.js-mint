<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>p5.js Mint</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>p5.js Mint</h1>
      <nav>
        <a href="#" id="new-sketch-btn">New Sketch</a>
        <a href="/gallery">Gallery</a>
      </nav>
    </header>
    <main id="editor-container">
      <div id="sketch-editor">
        <textarea id="code-editor" placeholder="Write your p5.js sketch here..."></textarea>
      </div>
      <div id="preview-container">
        <div id="preview"></div>
        <div id="preview-controls">
          <button id="run-btn">Run</button>
          <button id="stop-btn">Stop</button>
          <button id="mint-btn">Mint</button>
        </div>
      </div>
    </main>
    <footer>
      <p>Mint your p5.js creations as NFTs</p>
    </footer>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
